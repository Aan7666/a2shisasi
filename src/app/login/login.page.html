<div class="login-wrapper">

  <div class="background-layer"></div>

  <div class="stars-container">
    <div *ngFor="let star of stars" class="star" [ngStyle]="{
           'width.px': star.size,
           'height.px': star.size,
           'top.%': star.top,
           'left.%': star.left,
           'opacity': star.opacity
         }">
    </div>
  </div>

  <main class="main-content">

    <div class="brand-area">
      <img src="assets/logo/logo.svg" alt="Academy Logo" class="brand-logo" />
      <div class="brand-text">
        <span class="brand-subtitle sub-line-1">Where Learning Meets Opportunity</span>
        <span class="brand-subtitle sub-line-2">Learn, Grow, Succeed!</span>
      </div>
    </div>

    <button class="close-btn" (click)="goHome()" aria-label="Back">
      <span class="material-symbols-outlined">close</span>
    </button>

    <div class="login-card animate-slide-up">

      <div class="card-header">
        <h1>Sign In</h1>
        <p>
          Don't have an Account?
          <a routerLink="/register" class="text-link">Sign Up</a>
        </p>
      </div>

      <h2 class="form-title">Sign In to your Account</h2>

      <form class="login-form" (ngSubmit)="onLogin()">

        <div class="input-group">
          <span class="material-symbols-outlined input-icon">person</span>
          <input type="text" [(ngModel)]="username" name="username" placeholder="Email or Username" class="custom-input"
            required />
        </div>

        <div class="input-group">
          <span class="material-symbols-outlined input-icon">password</span>
          <input type="password" [(ngModel)]="password" name="password" placeholder="Password" class="custom-input"
            required />
        </div>

        <div class="forgot-password">
          <a routerLink="/lupa-password" class="text-link-small">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary">
          <span>Sign In</span>
        </button>

      </form>

      <div class="divider">
        <div class="line"></div>
        <span>Or Continue with</span>
        <div class="line"></div>
      </div>

      <button type="button" class="btn-social" (click)="loginWithGoogle()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" />
        <span>Google</span>
      </button>

    </div>
  </main>
</div>

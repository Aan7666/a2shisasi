<ion-content [fullscreen]="true">
  <div class="login-wrapper">

        <!-- SVG background curves -->
    <div class="background-layer">
      <div class="bg-waves">
        <svg width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="xMidYMin slice"
          xmlns="http://www.w3.org/2000/svg">
          <circle cx="350" cy="180" r="280" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="40" />
          <circle cx="350" cy="180" r="160" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="16" />
          <path d="M-100,450 C80,350 180,550 500,350" fill="none" stroke="rgba(255, 255, 255, 0.06)"
            stroke-width="60" />
          <path d="M-50,430 C130,330 230,530 550,330" fill="none" stroke="rgba(255, 255, 255, 0.03)"
            stroke-width="30" />
          <circle cx="50" cy="650" r="140" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="12" />
        </svg>
      </div>
    </div>

    <div class="stars-container">
      <div *ngFor="let star of stars" class="star" [ngStyle]="{
             'width.px': star.size,
             'height.px': star.size,
             'top.%': star.top,
             'left.%': star.left,
             'opacity': star.opacity
           }">
      </div>
    </div>
    
    <!-- Close Button -->
    <button class="close-btn" routerLink="/tabs" aria-label="Back">
      <ion-icon name="close-outline"></ion-icon>
    </button>
    <!-- Brand Area -->
    <div class="brand-area">
      <img alt="EduFlow Logo" class="brand-logo"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDduszmxaEl8ehTb68Bvhe8yULBRwgeeaG669BbHpKupUnELcBT6vOwWL5HoK3ZSuqaNfvLg8YCYm662gDc6fQA4Q61GvvqfC9Qh0NsmPoLKeYHikYLXjauXUQsgNKCr4H-dJ_vizS-fE3hSozKOVH67TbU3G-xcx9M_5CpUiocdX8AuoGUzFU6dCNU6MS0Uw3yqPr5jo5ahXSgqdGbjVYLmw1uBjbnBe5Lq0UCOBjJF8FVesrDNFSTxcDfNcVvpA3e7jRIiTpZuO4" />
      <span class="brand-tagline">Learn without limits.</span>
    </div>
    <main class="main-content">
      <div class="login-card animate-slide-up">
        <div class="card-header">
          <h1>Sign In</h1>
          <p>
            Don't have an Account?
            <a routerLink="/register" class="text-link">Sign Up</a>
          </p>
        </div>
        <h2 class="form-title">Sign In to your Account</h2>
        <form class="login-form" (ngSubmit)="onLogin()">
          <div class="input-group">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input type="email" [(ngModel)]="email" name="email" placeholder="Email" class="custom-input" required />
          </div>
          <div class="input-group">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
              placeholder="Password" class="custom-input" required />
            <button type="button" class="toggle-password-btn" (click)="togglePassword()" aria-label="Toggle password visibility">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
          <div class="forgot-password">
            <a routerLink="/lupa-password" class="text-link-small">Forgot Password?</a>
          </div>
          <button type="submit" class="btn-primary" [disabled]="isLoading">
            <span>{{ isLoading ? 'Loading...' : 'Sign In' }}</span>
          </button>
        </form>
        <div class="divider">
          <div class="line"></div>
          <span>Or Continue with</span>
          <div class="line"></div>
        </div>
        <button type="button" class="btn-social" (click)="loginWithGoogle()" [disabled]="isLoading">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" />
          <span>Google</span>
        </button>

        <!-- Terms and Privacy Disclaimer -->
        <div class="privacy-disclaimer">
          Dengan masuk, Anda menyetujui 
          <a (click)="openTerms()" class="disclaimer-link">Syarat & Ketentuan</a> 
          serta 
          <a (click)="openPrivacy()" class="disclaimer-link">Kebijakan Privasi</a> kami.
        </div>
      </div>
    </main>
  </div>
</ion-content>

<ion-content [fullscreen]="true">
  <div class="red-header">

    <!-- Normal mode -->
    <ng-container *ngIf="!isSearchMode">
      <div class="header-button filter-btn" (click)="openFilterSheet()">
        <ion-icon name="filter-outline"></ion-icon>
      </div>
      <h1 class="header-title">My Learning</h1>
    </ng-container>

    <!-- Search mode -->
    <div class="search-mode-wrapper" *ngIf="isSearchMode">
      <div class="search-bar-wrapper">
        <ion-icon name="search-outline" class="search-bar-icon"></ion-icon>
        <input class="search-bar-input" type="text" placeholder="Search courses..." [(ngModel)]="searchQuery"
          (input)="onSearch()" />
        <ion-icon name="close-circle" class="search-bar-clear" *ngIf="searchQuery" (click)="clearSearch()">
        </ion-icon>
      </div>
      <span class="cancel-text" (click)="toggleSearch()">Cancel</span>
    </div>

    <!-- Icon search (hanya saat normal mode) -->
    <div class="header-button search-btn" *ngIf="!isSearchMode" (click)="toggleSearch()">
      <ion-icon name="search-outline"></ion-icon>
    </div>

  </div>

  <div class="main-container">

    <!-- Tampilan setelah login: ada kursus -->
    <ng-container *ngIf="isLoggedIn">
      <div class="empty-state" *ngIf="filteredItems.length === 0">
        <div class="illustration-container">
          <div class="icon-wrapper desktop-wrapper">
            <ion-icon name="desktop-outline" class="empty-icon"></ion-icon>
          </div>
          <div class="icon-wrapper medal-wrapper">
            <ion-icon name="medal-outline" class="empty-icon"></ion-icon>
          </div>
          <div class="icon-wrapper book-wrapper">
            <ion-icon name="book-outline" class="empty-icon"></ion-icon>
          </div>
        </div>
        <h2 class="empty-title">Start learning something new</h2>
        <p class="empty-subtitle">The courses you join will show up here.</p>
      </div>

      <!-- List kursus (nanti diisi saat ada data) -->
      <!-- List kursus (nanti diisi saat ada data) -->
      <div class="courses-list" *ngIf="filteredItems.length > 0">
        <div class="course-card" *ngFor="let item of filteredItems" [routerLink]="['/detail-course']"
          style="cursor: pointer;">
          <div class="card-img-placeholder"></div>
          <div class="card-body">
            <h3 class="course-title">{{ item.title }}</h3>
            <p class="course-instructor">{{ item.instructor }}</p>
            <p class="course-price">{{ item.price }}</p>
            <div class="card-meta-row">
              <span class="meta-students">
                <ion-icon name="people-outline"></ion-icon>
                {{ item.students }}
              </span>
              <span class="meta-rating">
                <ion-icon name="star"></ion-icon>
                {{ item.rating }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Tampilan sebelum login -->
    <ng-container *ngIf="!isLoggedIn">
      <div class="empty-state">
        <div class="illustration-container">
          <div class="icon-wrapper desktop-wrapper">
            <ion-icon name="desktop-outline" class="empty-icon"></ion-icon>
          </div>
          <div class="icon-wrapper medal-wrapper">
            <ion-icon name="medal-outline" class="empty-icon"></ion-icon>
          </div>
          <div class="icon-wrapper book-wrapper">
            <ion-icon name="book-outline" class="empty-icon"></ion-icon>
          </div>
        </div>
        <h2 class="empty-title">Start learning something new</h2>
        <p class="empty-subtitle">The courses you join will show up here.</p>
      </div>
    </ng-container>

  </div>

  <ion-action-sheet [isOpen]="isActionSheetOpen" header="Filter" cssClass="custom-filter-sheet"
    [buttons]="actionSheetButtons" (didDismiss)="setActionSheetOpen(false)">
  </ion-action-sheet>

</ion-content>

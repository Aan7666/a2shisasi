<div class="privacy-wrapper">
  <!-- Decorative Stars background layer -->
  <div class="stars-container">
    <div class="star" style="top: 10%; left: 20%; width: 3px; height: 3px; opacity: 0.8;"></div>
    <div class="star" style="top: 25%; left: 80%; width: 2px; height: 2px; opacity: 0.5;"></div>
    <div class="star" style="top: 40%; left: 15%; width: 4px; height: 4px; opacity: 0.6;"></div>
    <div class="star" style="top: 60%; left: 70%; width: 3px; height: 3px; opacity: 0.4;"></div>
    <div class="star" style="top: 80%; left: 30%; width: 2px; height: 2px; opacity: 0.7;"></div>
  </div>

  <div class="background-layer">
    <div class="brand-area">
      <span class="brand-title">A2SHI ACADEMY</span>
      <span class="brand-subtitle">Learn without limits</span>
    </div>
  </div>

  <div class="main-content">
    <div class="privacy-card animate-slide-up" id="privacyCard">
      <div class="card-header">
        <h1>Kebijakan & Persetujuan</h1>
        <p>Silakan tinjau dan setujui dokumen hukum berikut untuk melanjutkan menggunakan aplikasi.</p>
      </div>

      <!-- Policy Links Cards -->
      <div class="policy-links-container">
        <button class="policy-link-card" (click)="openTerms()">
          <div class="card-left">
            <span class="material-symbols-outlined doc-icon">description</span>
            <div class="card-text">
              <h3>Syarat & Ketentuan</h3>
              <p>Ketentuan penggunaan layanan A2shi Academy</p>
            </div>
          </div>
          <span class="material-symbols-outlined arrow-icon">open_in_new</span>
        </button>

        <button class="policy-link-card" (click)="openPrivacy()">
          <div class="card-left">
            <span class="material-symbols-outlined doc-icon">shield</span>
            <div class="card-text">
              <h3>Kebijakan Privasi</h3>
              <p>Cara kami mengelola dan melindungi data Anda</p>
            </div>
          </div>
          <span class="material-symbols-outlined arrow-icon">open_in_new</span>
        </button>
      </div>

      <!-- Consent Controls -->
      <div class="consent-container">
        <label class="checkbox-label" for="agreeCheckbox">
          <input 
            type="checkbox" 
            id="agreeCheckbox" 
            [(ngModel)]="isAccepted"
          />
          <span class="custom-checkbox">
            <span class="material-symbols-outlined check-icon">check</span>
          </span>
          <span class="label-text">
            Saya menyatakan telah membaca dan menyetujui Syarat & Ketentuan serta Kebijakan Privasi yang berlaku.
          </span>
        </label>
      </div>

      <!-- Submit Button -->
      <button 
        id="agreeBtn" 
        class="btn-primary" 
        [disabled]="!isAccepted"
        (click)="onAgree()"
      >
        <span>Setuju & Lanjutkan</span>
        <span class="material-symbols-outlined btn-icon">arrow_forward</span>
      </button>
    </div>
  </div>
</div>
